<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Assistente Triunfo</title>

<link rel="stylesheet" href="https://cdn.botframework.com/botframework-webchat/latest/webchat.css" />

<style>
:root{
  --bg-dark:#000000;
  --bg-panel:#050505;
  --green:#22C55E;
  --green-soft:rgba(34,197,94,.12);
  --border:rgba(255,255,255,.13);
  --text:#F8FAFC;
  --muted:#C7CBD1;
  --danger:#DC2626;
}

*{
  box-sizing:border-box;
}

html, body{
  height:100%;
  margin:0;
  background:#000000;
  color:var(--text);
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Segoe UI', sans-serif;
}

.wrap{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000000;
}

.shell{
  width:95%;
  max-width:1100px;
  height:90vh;
  background:#000000;
  border:1px solid var(--border);
  border-radius:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  backdrop-filter:blur(10px);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:105px;
  padding:26px 28px;
  border-bottom:1px solid var(--border);
  background:#050505;
}

.brand{
  display:flex;
  align-items:center;
  gap:28px;
}

.logoWrap img{
  height:48px;
  width:auto;
  display:block;
}

.meta .title{
  font-weight:700;
  font-size:22px;
  color:#ffffff;
}

.meta .subtitle{
  font-size:15px;
  color:var(--muted);
}

.meta .subtitle a{
  color:var(--muted);
  text-decoration:none;
}

.meta .subtitle a:hover{
  text-decoration:underline;
  color:var(--green);
}

.actions{
  display:flex;
  align-items:center;
  gap:28px;
}

.statusPill{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:16px;
  color:#ffffff;
}

.statusDot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

#btn-limpar{
  background:transparent;
  border:1px solid var(--green);
  color:var(--green);
  padding:13px 22px;
  border-radius:13px;
  cursor:pointer;
  font-weight:700;
  font-size:15px;
  transition:0.2s;
}

#btn-limpar:hover{
  background:rgba(34,197,94,0.15);
}

#webchat-wrapper{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  background:#000000;
}

#webchat{
  height:100%;
  width:100%;
}

/* footer escondido para ficar igual ao modelo */
footer{
  display:none;
}

/* bolhas */
.webchat__bubble__content{
  border-radius:10px !important;
}

.webchat__bubble__content:not(.webchat__bubble--from-user){
  background-color:#374151 !important;
  color:white !important;
}

/* =========================
   ADAPTIVE CARDS
   ========================= */

#webchat .ac-adaptiveCard{
  border-radius:16px !important;
}

/* texto digitado nos campos */
#webchat input,
#webchat textarea,
#webchat select{
  color:#000 !important;
}

/* placeholder */
#webchat input::placeholder,
#webchat textarea::placeholder{
  color:#6b7280 !important;
}

/* remove borda verde e deixa botões/opções limpos */
#webchat .ac-pushButton,
#webchat .ac-actionSet button,
#webchat .webchat__adaptive-card-renderer button{
  background:#ffffff !important;
  color:#000000 !important;
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
  border-radius:18px !important;
  min-height:46px !important;
  transition:background .15s ease, color .15s ease, transform .05s ease !important;
}

/* garante texto interno preto */
#webchat .ac-pushButton *,
#webchat .ac-actionSet button *,
#webchat .webchat__adaptive-card-renderer button *{
  color:#000000 !important;
}

/* hover suave */
#webchat .ac-pushButton:hover,
#webchat .ac-actionSet button:hover,
#webchat .webchat__adaptive-card-renderer button:hover{
  background:#f3f4f6 !important;
  color:#000000 !important;
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
}

/* clique / foco / selecionado = vermelho */
#webchat .ac-pushButton:active,
#webchat .ac-pushButton:focus,
#webchat .ac-pushButton:focus-visible,
#webchat .ac-pushButton[aria-pressed="true"],
#webchat .ac-actionSet button:active,
#webchat .ac-actionSet button:focus,
#webchat .ac-actionSet button:focus-visible,
#webchat .ac-actionSet button[aria-pressed="true"],
#webchat .webchat__adaptive-card-renderer button:active,
#webchat .webchat__adaptive-card-renderer button:focus,
#webchat .webchat__adaptive-card-renderer button:focus-visible,
#webchat .webchat__adaptive-card-renderer button[aria-pressed="true"]{
  background:var(--danger) !important;
  color:#ffffff !important;
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
}

/* texto interno branco quando selecionado */
#webchat .ac-pushButton:active *,
#webchat .ac-pushButton:focus *,
#webchat .ac-pushButton:focus-visible *,
#webchat .ac-pushButton[aria-pressed="true"] *,
#webchat .ac-actionSet button:active *,
#webchat .ac-actionSet button:focus *,
#webchat .ac-actionSet button:focus-visible *,
#webchat .ac-actionSet button[aria-pressed="true"] *,
#webchat .webchat__adaptive-card-renderer button:active *,
#webchat .webchat__adaptive-card-renderer button:focus *,
#webchat .webchat__adaptive-card-renderer button:focus-visible *,
#webchat .webchat__adaptive-card-renderer button[aria-pressed="true"] *{
  color:#ffffff !important;
}

/* radios e checkboxes em vermelho */
#webchat input[type="radio"],
#webchat input[type="checkbox"]{
  accent-color:var(--danger) !important;
}

/* mobile */
@media (max-width: 768px){
  .shell{
    width:100%;
    height:100vh;
    max-width:none;
    border-radius:0;
  }

  header{
    min-height:92px;
    padding:18px 14px;
    gap:12px;
  }

  .brand{
    gap:14px;
  }

  .logoWrap img{
    height:36px;
  }

  .actions{
    gap:10px;
  }

  .meta .title{
    font-size:18px;
  }

  .meta .subtitle{
    font-size:12px;
  }

  .statusPill{
    font-size:13px;
  }

  #btn-limpar{
    padding:9px 12px;
    font-size:13px;
  }
}

@media (max-width: 520px){
  header{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
    justify-content:space-between;
  }

  .logoWrap img{
    height:34px;
  }

  .meta .title{
    font-size:17px;
  }

  .meta .subtitle{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="wrap">
  <div class="shell">

    <header>
      <div class="brand">
        <div class="logoWrap" title="Triunfo Logística">
          <img src="https://triunfologistica.com.br/wp-content/uploads/2023/09/Triunfo_NOVO_horizontal-branca.png" alt="Triunfo" />
        </div>

        <div class="meta">
          <div class="title">Triunfo Bot</div>
          <div class="subtitle">
            Atendimento inteligente •
            <a href="https://triunfologistica.com.br/" target="_blank" rel="noopener">triunfologistica.com.br</a>
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="statusPill" title="Status do bot">
          <span id="botStateText">Online</span>
          <span id="statusDot" class="statusDot"></span>
        </div>

        <button onclick="restartChat()" id="btn-limpar">Limpar Conversa</button>
      </div>
    </header>

    <div id="webchat-wrapper">
      <div id="webchat"></div>
    </div>

    <footer>
      <div>Triunfo Logística • WebChat</div>
      <div>© 2026</div>
    </footer>

  </div>
</div>

<script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

<script>
const directLineSecret = "BhiuQCvJMH9ZOvzOJ9lx0TWpQ1ztXWA2lCYWoNOxfRwLG15x53AgJQQJ99BHACL93NaAArohAAABAZBS4EtK.6Sde7jEcs7g6XibB7vZp8lmLIRhy2WDUmaBkfLHzs84X1g8ZR7R7JQQJ99CBACHYHv6AArohAAABAZBSoSj9";

async function startChat() {
  const tokenResponse = await fetch("https://directline.botframework.com/v3/directline/tokens/generate", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + directLineSecret
    }
  });

  const { token } = await tokenResponse.json();

  const styleOptions = {
    backgroundColor: 'transparent',

    // Bolhas do Bot
    bubbleBackground: '#374151',
    bubbleTextColor: 'white',
    bubbleBorderRadius: 10,
    bubblePadding: 8,

    // Bolhas do Usuário
    bubbleFromUserBackground: '#FFFFFF',
    bubbleFromUserTextColor: 'black',
    bubbleFromUserBorderRadius: 10,
    bubbleFromUserPadding: 8,

    bubbleMinHeight: 30,
    bubbleMaxWidth: 450,
    fontSizeSmall: '12px',

    // Barra de digitação
    sendBoxBackground: 'rgba(0,0,0,0.4)',
    sendBoxTextColor: 'white',
    sendBoxHeight: 50,
    hideUploadButton: true
  };

  window.WebChat.renderWebChat({
    directLine: window.WebChat.createDirectLine({ token }),
    styleOptions: styleOptions,
    locale: 'pt-BR'
  }, document.getElementById('webchat'));
}

function restartChat() {
  const wrapper = document.getElementById('webchat-wrapper');
  wrapper.innerHTML = '<div id="webchat"></div>';
  startChat();
}

startChat();
</script>

</body>
</html>
