<style>
:root{
  --bg-dark:#070A10;
  --bg-panel:#0B1220;
  --green:#22C55E;
  --green-soft:rgba(34,197,94,.18);
  --border:rgba(255,255,255,.08);
  --text:#E8EEFC;
  --muted:#9CA3AF;
}

*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  background:linear-gradient(180deg,var(--bg-dark),var(--bg-panel));
  color:var(--text);
  overflow:hidden;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Segoe UI', sans-serif;
}

.wrap{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.shell{
  width:95%;
  max-width:1100px;
  height:90vh;
  background:rgba(15, 23, 42, .75);
  border:1px solid var(--border);
  border-radius:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  backdrop-filter:blur(10px);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.3);
}

.brand{ display:flex; align-items:center; gap:15px; }
.logoWrap img{ height:22px; }
.meta .title{ font-weight:700; font-size:16px; }
.meta .subtitle{ font-size:12px; color:var(--muted); }
.meta .subtitle a{ color:var(--muted); text-decoration:none; }
.meta .subtitle a:hover{ text-decoration:underline; color:var(--green); }

.actions{ display:flex; align-items:center; gap:15px; }
.statusPill{ display:flex; align-items:center; gap:8px; font-size:13px; }
.statusDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
}

#webchat-wrapper{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  background:transparent;
}

#webchat{ height:100%; width:100%; }

footer{
  padding:10px 20px;
  font-size:11px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--border);
  background:rgba(0,0,0,0.2);
}

/* deixa verde só o botão do cabeçalho */
#btn-limpar{
  background:var(--green-soft);
  border:1px solid var(--green);
  color:#fff;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}
#btn-limpar:hover{
  background:rgba(34,197,94, 0.3);
}

/* bolhas */
.webchat__bubble__content{
  border-radius:10px !important;
}
.webchat__bubble__content:not(.webchat__bubble--from-user){
  background-color:#374151 !important;
  color:#fff !important;
}

/* -------- Adaptive Cards -------- */

/* fundo branco e texto preto */
#webchat .ac-adaptiveCard{
  background:#fff !important;
  color:#000 !important;
  border-radius:12px !important;
}

#webchat .ac-textBlock,
#webchat .ac-label,
#webchat .ac-input-label,
#webchat label,
#webchat input,
#webchat textarea,
#webchat select,
#webchat option{
  color:#000 !important;
}

/* campos */
#webchat input,
#webchat textarea,
#webchat select{
  background:#fff !important;
  border:1px solid #d1d5db !important;
  color:#000 !important;
  border-radius:8px !important;
}

/* opções/botões dos cards sem borda verde */
#webchat .ac-pushButton,
#webchat .ac-actionSet button,
#webchat .webchat__adaptive-card-renderer button{
  background:#fff !important;
  border:none !important;
  box-shadow:none !important;
  color:#000 !important;
  border-radius:10px !important;
}

/* hover */
#webchat .ac-pushButton:hover,
#webchat .ac-actionSet button:hover,
#webchat .webchat__adaptive-card-renderer button:hover{
  background:#fee2e2 !important;
  color:#991b1b !important;
}

/* selecionado / foco / clique = vermelho */
#webchat .ac-pushButton:focus,
#webchat .ac-pushButton:active,
#webchat .ac-actionSet button:focus,
#webchat .ac-actionSet button:active,
#webchat .webchat__adaptive-card-renderer button:focus,
#webchat .webchat__adaptive-card-renderer button:active{
  background:#dc2626 !important;
  color:#fff !important;
  outline:none !important;
  box-shadow:0 0 0 2px rgba(220,38,38,.25) !important;
}

/* radio / checkbox = vermelho */
#webchat input[type="radio"],
#webchat input[type="checkbox"]{
  accent-color:#dc2626 !important;
}
</style>
